<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Meme Slider</title>
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png">
    <link rel="manifest" href="assets/favicon/site.webmanifest">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>CSS Meme Slide</h1>
        <div class="slider">
            <input type="radio" name="button" id="button1" checked>
            <input type="radio" name="button" id="button2">
            <input type="radio" name="button" id="button3">
            <input type="radio" name="button" id="button4">
            <input type="radio" name="button" id="button5">
            <input type="radio" name="button" id="button6">
            <input type="radio" name="button" id="button7">
            <input type="radio" name="button" id="button8">
            <input type="radio" name="button" id="button9">
            <input type="radio" name="button" id="button10">
            <div class="memes">
                <ul>
                    <li id="slide01"><img src="assets/imges/meme01.jpg" alt="meme01"></li>
                    <li id="slide02"><img src="assets/imges/meme02.jpg" alt="meme02"></li>
                    <li id="slide03"><img src="assets/imges/meme03.png" alt="meme03"></li>
                    <li id="slide04"><img src="assets/imges/meme04.png" alt="meme04"></li>
                    <li id="slide05"><img src="assets/imges/meme05.png" alt="meme05"></li>
                    <li id="slide06"><img src="assets/imges/meme06.png" alt="meme06"></li>
                    <li id="slide07"><img src="assets/imges/meme07.jpg" alt="meme07"></li>
                    <li id="slide08"><img src="assets/imges/meme08.png" alt="meme08"></li>
                    <li id="slide09"><img src="assets/imges/meme09.jpg" alt="meme09"></li>
                    <li id="slide10"><img src="assets/imges/meme10.jpg" alt="meme10"></li>
                </ul>
            </div>

            <div class="lables">
                <label for="button1">Guess what I found!</label>
                <label for="button1">Hey, got a meme for you!</label>
                <label for="button2">Oh no, here comes another one</label>
                <label for="button3">Just look at this!</label>
                <label for="button4">You have to see this one!</label>
                <label for="button5">Last one, I promise!</label>
                <label for="button6">No, THIS is the last one!</label>
                <label for="button7">Okay, I couldn’t resist.</label>
                <label for="button8">You’re gonna love this!</label>
                <label for="button9">You’ll thank me later for this!</label>
            </div>
        </div>
    </div>

</body>

</html>
